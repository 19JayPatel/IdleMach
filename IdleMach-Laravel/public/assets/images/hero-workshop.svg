<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Illustration of a CNC machine in a workshop</title>
  <desc id="heroDesc">A flat industrial illustration of a CNC turning machine on a workshop floor, with a weekly capacity board showing booked and idle hours.</desc>

  <defs>
    <pattern id="heroGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d3e2e4" stroke-width="1"/>
    </pattern>
    <pattern id="heroHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#93a7ac" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Workshop shell -->
  <rect width="880" height="720" fill="#e9f1f2"/>
  <rect width="880" height="720" fill="url(#heroGrid)" opacity="0.72"/>
  <rect y="500" width="880" height="220" fill="#dce7e9"/>
  <path d="M0 500h880" fill="none" stroke="#b7c9ce" stroke-width="2"/>

  <!-- Wall details -->
  <rect x="0" y="88" width="500" height="12" rx="6" fill="#b9c6cb"/>
  <rect x="60" y="118" width="98" height="70" rx="4" fill="#f5f7f8" stroke="#b9c6cb" stroke-width="2"/>
  <rect x="60" y="118" width="98" height="16" rx="4" fill="#0f5c6b"/>
  <path d="M74 150h70M74 163h54M74 176h62" fill="none" stroke="#b9c6cb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94" cy="236" r="24" fill="#f5f7f8" stroke="#93a7ac" stroke-width="2"/>
  <path d="M94 236v-13M94 236l9 6" fill="none" stroke="#10202b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94" cy="236" r="2.5" fill="#10202b"/>
  <rect x="142" y="214" width="58" height="44" rx="4" fill="#f5f7f8" stroke="#b9c6cb" stroke-width="2"/>
  <path d="M152 228h38M152 238h28M152 248h34" fill="none" stroke="#b9c6cb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Overhead light fittings -->
  <g>
    <rect x="238" y="58" width="154" height="10" rx="5" fill="#10202b"/>
    <rect x="244" y="68" width="142" height="8" rx="4" fill="#fbfcfc" stroke="#b9c6cb" stroke-width="2"/>
    <rect x="548" y="24" width="154" height="10" rx="5" fill="#10202b" opacity="0.35"/>
  </g>

  <!-- Material rack, left -->
  <g>
    <rect x="68" y="338" width="12" height="162" rx="3" fill="#0a414c"/>
    <rect x="198" y="338" width="12" height="162" rx="3" fill="#0a414c"/>
    <rect x="68" y="376" width="142" height="9" rx="2" fill="#93a7ac"/>
    <rect x="68" y="430" width="142" height="9" rx="2" fill="#93a7ac"/>
    <rect x="68" y="484" width="142" height="9" rx="2" fill="#93a7ac"/>
    <rect x="84" y="348" width="108" height="16" rx="2" fill="#c8d4d7" stroke="#93a7ac"/>
    <rect x="92" y="332" width="92" height="14" rx="2" fill="#aebfc6" stroke="#93a7ac"/>
    <rect x="84" y="392" width="62" height="26" rx="3" fill="#9a5b0b"/>
    <rect x="152" y="400" width="38" height="18" rx="2" fill="#c8d4d7" stroke="#93a7ac"/>
    <rect x="88" y="442" width="96" height="30" rx="3" fill="#e3eaec" stroke="#93a7ac" stroke-width="2"/>
    <path d="M88 452h96M112 442v30M160 442v30" fill="none" stroke="#b9c6cb" stroke-width="2"/>
    <rect x="80" y="496" width="112" height="4" rx="2" fill="#b9c6cb"/>
  </g>

  <!-- Capacity board -->
  <g transform="translate(510 44)">
    <rect x="8" y="8" width="304" height="188" rx="12" fill="#a8c0c5" opacity="0.55"/>
    <rect width="304" height="188" rx="12" fill="#ffffff" stroke="#b9c6cb" stroke-width="2"/>
    <text x="20" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#10202b">Weekly capacity</text>
    <text x="20" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6a72">Set by the machine owner</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#5b6a72" text-anchor="middle">
      <text x="40" y="72">M</text>
      <text x="94" y="72">T</text>
      <text x="148" y="72">W</text>
      <text x="202" y="72">T</text>
      <text x="256" y="72">F</text>
    </g>
    <g>
      <rect x="20" y="80" width="40" height="68" rx="4" fill="#eef2f3"/>
      <rect x="20" y="112" width="40" height="36" rx="4" fill="#0f5c6b"/>
      <rect x="20" y="80" width="40" height="32" rx="4" fill="#d9a55a"/>

      <rect x="74" y="80" width="40" height="68" rx="4" fill="#eef2f3"/>
      <rect x="74" y="88" width="40" height="60" rx="4" fill="#0f5c6b"/>
      <rect x="74" y="80" width="40" height="8" rx="4" fill="#d9a55a"/>

      <rect x="128" y="80" width="40" height="68" rx="4" fill="#eef2f3"/>
      <rect x="128" y="116" width="40" height="32" rx="4" fill="#0f5c6b"/>
      <rect x="128" y="80" width="40" height="36" rx="4" fill="#d9a55a"/>

      <rect x="182" y="80" width="40" height="68" rx="4" fill="#eef2f3"/>
      <rect x="182" y="84" width="40" height="64" rx="4" fill="#0f5c6b"/>
      <rect x="182" y="80" width="40" height="4" rx="2" fill="#d9a55a"/>

      <rect x="236" y="80" width="40" height="68" rx="4" fill="#eef2f3"/>
      <rect x="236" y="124" width="40" height="24" rx="4" fill="#0f5c6b"/>
      <rect x="236" y="80" width="40" height="44" rx="4" fill="#d9a55a"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5b6a72">
      <circle cx="24" cy="166" r="4" fill="#0f5c6b"/>
      <text x="34" y="169">Booked</text>
      <circle cx="102" cy="166" r="4" fill="#d9a55a"/>
      <text x="112" y="169">Idle / available</text>
    </g>
  </g>

  <!-- CNC machine -->
  <g>
    <rect x="238" y="486" width="546" height="28" rx="14" fill="#c4d4d8"/>
    <rect x="262" y="466" width="496" height="34" rx="6" fill="#0a414c"/>
    <g>
      <rect x="274" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="310" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="346" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="382" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="418" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="454" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="490" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="526" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="562" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="598" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="634" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="670" y="476" width="18" height="10" fill="#d9a55a"/>
      <rect x="706" y="476" width="18" height="10" fill="#d9a55a"/>
    </g>

    <rect x="286" y="266" width="448" height="202" rx="14" fill="#0f5c6b"/>
    <rect x="286" y="266" width="448" height="24" rx="14" fill="#0a414c"/>
    <rect x="286" y="280" width="448" height="10" fill="#0a414c"/>
    <rect x="316" y="302" width="318" height="142" rx="6" fill="#f5f7f8" stroke="#0a414c" stroke-width="2"/>
    <rect x="332" y="318" width="246" height="110" rx="4" fill="#17323d"/>
    <path d="M340 326l70-1-52 94-26 1z" fill="#ffffff" opacity="0.08"/>

    <!-- Chuck and workpiece -->
    <g>
      <circle cx="396" cy="373" r="37" fill="#c8d4d7" stroke="#93a7ac" stroke-width="3"/>
      <circle cx="396" cy="373" r="12" fill="#17323d"/>
      <rect x="388" y="342" width="16" height="16" rx="2" fill="#93a7ac" transform="rotate(0 396 350)"/>
      <rect x="388" y="388" width="16" height="16" rx="2" fill="#93a7ac" transform="rotate(0 396 396)"/>
      <rect x="366" y="365" width="16" height="16" rx="2" fill="#93a7ac"/>
      <rect x="410" y="365" width="16" height="16" rx="2" fill="#93a7ac"/>
      <rect x="414" y="365" width="78" height="16" rx="3" fill="#e3eaec" stroke="#93a7ac" stroke-width="2"/>
      <rect x="472" y="369" width="20" height="8" rx="2" fill="#9a5b0b"/>
    </g>

    <!-- Door detail -->
    <rect x="596" y="346" width="9" height="52" rx="4" fill="#93a7ac"/>
    <path d="M320 455h308" fill="none" stroke="#0a414c" stroke-width="2" opacity="0.45"/>
    <text x="320" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#dce7e9">CNC TURNING</text>

    <!-- Control panel -->
    <rect x="650" y="300" width="68" height="146" rx="6" fill="#dce7e9" stroke="#0a414c" stroke-width="2"/>
    <rect x="660" y="312" width="48" height="38" rx="3" fill="#10202b"/>
    <path d="M668 326h32M668 335h22" fill="none" stroke="#7fb4bb" stroke-width="3" stroke-linecap="round"/>
    <g>
      <circle cx="670" cy="368" r="5" fill="#1b6e45"/>
      <circle cx="688" cy="368" r="5" fill="#d9a55a"/>
      <circle cx="670" cy="386" r="5" fill="#93a7ac"/>
      <circle cx="688" cy="386" r="5" fill="#93a7ac"/>
      <rect x="662" y="402" width="42" height="12" rx="2" fill="#93a7ac"/>
      <rect x="662" y="422" width="42" height="6" rx="3" fill="#93a7ac"/>
      <rect x="662" y="433" width="42" height="6" rx="3" fill="#93a7ac"/>
    </g>
    <circle cx="684" cy="279" r="9" fill="#d9a55a" stroke="#0a414c" stroke-width="2"/>
    <rect x="680" y="286" width="8" height="7" fill="#0a414c"/>

    <!-- Ventilation slots -->
    <path d="M310 435h96M310 443h76" fill="none" stroke="#0a414c" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Floor markings and small details -->
  <path d="M232 540h580" fill="none" stroke="#d9a55a" stroke-width="4" stroke-dasharray="18 14" opacity="0.65"/>
  <g>
    <rect x="780" y="510" width="46" height="58" rx="4" fill="#e3eaec" stroke="#93a7ac" stroke-width="2"/>
    <path d="M790 522h26M790 534h18" fill="none" stroke="#93a7ac" stroke-width="3" stroke-linecap="round"/>
    <rect x="770" y="568" width="66" height="8" rx="3" fill="#b9c6cb"/>
  </g>
  <g stroke="#b9c6cb" stroke-width="2" fill="none">
    <path d="M28 560h120M28 584h84"/>
  </g>
</svg>
